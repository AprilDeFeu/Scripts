# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-json
    -   id: check-added-large-files
-   repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
    -   id: gitleaks
-   repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
    -   id: markdownlint
        exclude: '^\.github/instructions/.*\.md$'
-   repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
    -   id: shellcheck
-   repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
    -   id: prettier
        types: [yaml, json, markdown]
-   repo: local
    hooks:
    -   id: psscriptanalyzer
        name: psscriptanalyzer
        entry: pwsh -Command "Invoke-ScriptAnalyzer -Path PowerShell/ -Recurse -ExcludeRule PSAvoidUsingWriteHost"
        language: system
        types: [powershell]
        pass_filenames: false
    -   id: powershell-pester-tests
        name: powershell-pester-tests
        entry: pwsh .githooks/pre-commit.ps1
        language: system
        types: [powershell]
        files: ^PowerShell/system-administration/maintenance/system-maintenance\.ps1$
        pass_filenames: false

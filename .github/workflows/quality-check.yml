name: Repository Quality Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install markdownlint
        run: npm install --global markdownlint-cli@0.39.0

      - name: Lint Markdown files
        run: markdownlint "**/*.md" --config .markdownlint.json --ignore node_modules

  script-validation:
    name: Basic Script Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Validate PowerShell scripts
        run: |
          # Find PowerShell scripts and validate syntax
          find . -name "*.ps1" -type f | while read script; do
            echo "Checking syntax of $script"
            # Basic syntax check (would need PowerShell Core installed)
            # pwsh -NoProfile -NonInteractive -Command "& { try { [System.Management.Automation.PSParser]::Tokenize((Get-Content '$script' -Raw), [ref]\$null) | Out-Null; Write-Host 'OK: $script' } catch { Write-Error 'SYNTAX ERROR in $script: $_'; exit 1 } }"
          done
        continue-on-error: true
        
      - name: Validate Python scripts
        run: |
          # Install Python and check syntax
          python3 -m py_compile $(find . -name "*.py" -type f) || true
        continue-on-error: true
        
      - name: Validate Bash scripts
        run: |
          # Check bash scripts with shellcheck if available
          if command -v shellcheck >/dev/null 2>&1; then
            find . -name "*.sh" -type f -exec shellcheck {} \; || true
          else
            echo "shellcheck not available, skipping bash validation"
          fi
        continue-on-error: true

  repository-structure:
    name: Repository Structure Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Validate repository structure
        run: |
          echo "Checking repository structure..."
          
          # Check for required top-level files
          required_files=("README.md" "LICENSE" "INSTRUCTIONS.md" "CONTRIBUTING.md")
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            else
              echo "✓ Found: $file"
            fi
          done
          
          # Check for expected language directories
          expected_dirs=("Bash" "Go" "JavaScript" "PowerShell" "Python" "Ruby")
          for dir in "${expected_dirs[@]}"; do
            if [[ ! -d "$dir" ]]; then
              echo "WARNING: Missing expected directory: $dir"
            else
              echo "✓ Found: $dir/"
            fi
          done
          
          # Check category structure within language directories
          categories=("automation" "data-processing" "miscellaneous" "networking" "system-administration" "text-processing" "web-scraping")
          for lang_dir in "${expected_dirs[@]}"; do
            if [[ -d "$lang_dir" ]]; then
              for category in "${categories[@]}"; do
                if [[ ! -d "$lang_dir/$category" ]]; then
                  echo "INFO: Missing category $category in $lang_dir"
                fi
              done
            fi
          done
          
          echo "Repository structure validation complete"